build:
  base-paths:
    - src
  build-base: build
  install-base: install
  merge-install: true
  symlink-install: true
  # Avoid launching one package build per Orin CPU core. Individual CMake
  # builds are already parallelized by MAKEFLAGS from the image.
  parallel-workers: 4
  cmake-args:
    - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    - -DBUILD_TESTING=OFF
    - -DBUILD_WITH_CUDA=OFF
    - -DBUILD_WITH_VIEWER=OFF
    - -DBUILD_WITH_OPENCV=OFF
    - -DBUILD_WITH_CV_BRIDGE=OFF
