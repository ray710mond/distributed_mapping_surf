# One physical HaLow link. TCP carries reliable recovery/control only.
/**/halow_bridge:
  ros__parameters:
    network_interface: network_bridge::UdpInterface
    UdpInterface:
      local_address: 10.43.30.1
      receive_port: 46000
      remote_address: 10.43.30.2
      send_port: 46000
    default_rate: 100.0
    default_zstd_level: 1
    publish_stale_data: false
    /realtime_tx.queue_depth: 256
    /realtime_tx.queue_bytes: 307200
    topics:
    - /realtime_tx
    - /drone_odometry
    - /sync_tx
    subscribe_namespace: /drone/transport
    publish_namespace: /drone/transport
    /sync_tx.queue_depth: 256
    /sync_tx.queue_bytes: 307200
/**/halow_control_bridge:
  ros__parameters:
    network_interface: network_bridge::TcpInterface
    TcpInterface:
      role: client
      remote_address: 10.43.30.2
      port: 46001
    default_rate: 100.0
    default_zstd_level: 1
    publish_stale_data: false
    subscribe_namespace: /drone/transport
    publish_namespace: /drone/transport
