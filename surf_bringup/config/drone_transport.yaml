/**/halow_bridge:
  ros__parameters:
    network_interface: network_bridge::UdpInterface
    UdpInterface:
      # Bind the real-time lane to the drone HaLow AP, not the AX210 link.
      local_address: 10.43.30.1
      receive_port: 46000
      remote_address: 10.43.30.2
      send_port: 46000
    default_rate: 100.0
    default_zstd_level: 1
    publish_stale_data: false
    topics:
      - /realtime_tx
      # Common-map odometry produced by global_odometry.
      - /drone_odometry
    subscribe_namespace: /drone/transport
    publish_namespace: /drone/transport

/**/wifi_bridge:
  ros__parameters:
    network_interface: network_bridge::TcpInterface
    TcpInterface:
      role: client
      # network_bridge 3.0.0 has no TCP local_address parameter. Connecting to
      # The laptop AP/server is 10.42.20.1; this on-link destination makes
      # Linux select the Jetson AX210's static 10.42.20.2 address. Verify the
      # selected source with `ip route get 10.42.20.1` before launch.
      remote_address: 10.42.20.1
      port: 46001
    default_rate: 100.0
    default_zstd_level: 1
    publish_stale_data: false
    topics:
      - /sync_tx
    subscribe_namespace: /drone/transport
    publish_namespace: /drone/transport
