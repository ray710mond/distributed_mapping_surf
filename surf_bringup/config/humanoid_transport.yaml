# One physical 5 GHz peer link. TCP carries reliable recovery/control only.
/**/halow_bridge:
  ros__parameters:
    network_interface: network_bridge::UdpInterface
    UdpInterface:
      local_address: 10.42.20.1
      receive_port: 46000
      remote_address: 10.42.20.2
      send_port: 46000
    default_rate: 100.0
    default_zstd_level: 1
    publish_stale_data: false
    topics:
    - /humanoid_odometry
    - /realtime_ack
    /realtime_ack.queue_depth: 256
    /realtime_ack.queue_bytes: 65536
    subscribe_namespace: /humanoid/transport
    publish_namespace: /humanoid/transport
/**/halow_control_bridge:
  ros__parameters:
    network_interface: network_bridge::TcpInterface
    TcpInterface:
      role: server
      port: 46001
    default_rate: 100.0
    default_zstd_level: 1
    publish_stale_data: false
    topics:
    - /drone_initialpose
    - /sync_ack
    - /sync_request
    /sync_ack.queue_depth: 256
    /sync_ack.queue_bytes: 65536
    subscribe_namespace: /humanoid/transport
    publish_namespace: /humanoid/transport
