# Outdoor-informed starting point; see docs/outdoor_lqr_tuning.md for evidence
# and limitations. Capacity and B remain uncalibrated development assumptions.
/**/drone_scan_sender:
  ros__parameters:
    use_sim_time: false
    robot_name: drone
    map_frame: map
    input_topic: /drone/points
    realtime_topic: /drone/transport/realtime_tx
    realtime_ack_topic: /drone/transport/realtime_ack
    realtime_ack_metrics_topic: /drone/comm/realtime_ack_metrics
    sync_topic: /drone/transport/sync_tx
    sync_ack_topic: /drone/transport/sync_ack
    sync_request_topic: /drone/transport/sync_request
    link_metrics_topic: /surf/comm/link_metrics
    metrics_topic: /drone/comm/pipeline_metrics
    pose_source:
      type: tf
      odometry_topic: /drone/odom
      odometry_parent_frame: map
      base_frame: drone/body
      max_age_ms: 50.0
      tf_timeout_ms: 500.0
    resolution: 0.05
    mapping:
      # Observed local region around the current sensor. Keep fine resolution;
      # do not expand a single free ray into a wholly free coarse voxel.
      radius_metres: 10.0
      maximum_ray_cells_per_scan: 32768
    compression_level: 1
    transport:
      maximum_packet_bytes: 1200
    dynamic_retention_scans: 20
    maximum_ray_voxels: 1200
    # Outdoor clearing took 264–323 ms median. Rotate a smaller ray subset;
    # validate clearing latency in the next run (miss threshold stays unchanged).
    maximum_clear_rays: 1024
    filters:
      min_range: 0.75
      max_range: 50.0
      min_z: 0.25
      max_z: 20.0
      self_radius: 0.7
      humanoid_mask:
        enabled: true
        odometry_topic: /drone/transport/humanoid_odometry
        model_size_x: 0.6
        model_size_y: 0.7
        model_size_z: 1.4
        model_center_z: 0.7
        padding: 0.2
        max_age_ms: 150.0
      static_min_hits: 20
      clear_min_misses: 3
    allocation:
      dt: 0.1
      a:
      - 1.0
      - 0.0
      - 0.0
      - 1.0
      b:
      - -0.001
      - 0.0
      - 0.0
      - -0.001
      q:
      # Favor fresh debt without slowing isolated BACKLOG/tail drainage.
      - 100.0
      - 0.0
      - 0.0
      - 1.0
      r:
      - 0.0001
      - 0.0
      - 0.0
      - 0.0001
    delivery:
      # Observed successful ACK RTT reached 2.64 s, including executor delays.
      ack_timeout_seconds: 4.0
      # Outdoor control intervals reached 1.00 s; allow a selection opportunity.
      defer_seconds: 1.5
    capacity:
      development_bytes_per_second: 10000.0
      telemetry_timeout_seconds: 3.0
    scheduling:
      cluster_enabled: true
      # Per-voxel bonus = weight * log(1 + unsent changed neighbors).
      spatial_change_weight: 1.0
      maximum_entries_per_cycle: 4096
      # Bound proximity-connected BACKLOG traversal independently of debt scoring.
      maximum_cluster_traversal_entries: 8192
      # 2 voxels = 10 cm at 5 cm resolution; groups sparse quantized samples.
      cluster_neighbour_radius_voxels: 2
      delta_hz: 10.0
      backlog_hz: 10.0
      starvation_fraction: 0.1
      starvation_age_seconds: 30.0
    priority:
      delta:
        base: 1.0
        age: 1.0
        proximity: 1.0
        # Obstacle evidence precedes the much larger new-free-space volume.
        occupied: 2.0
        dynamic: 1.0
        destructive: 1.0
        age_seconds: 10.0
        distance_metres: 10.0
      backlog:
        base: 1.0
        age: 2.0
        proximity: 1.0
        # Obstacle evidence precedes the much larger new-free-space volume.
        occupied: 2.0
        dynamic: 1.0
        destructive: 1.0
        age_seconds: 10.0
        distance_metres: 10.0
