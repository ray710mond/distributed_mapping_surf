# Development LQR, priority and capacity defaults require experimental tuning.
/**/drone_scan_sender:
  ros__parameters:
    use_sim_time: false
    robot_name: drone
    map_frame: map
    input_topic: /drone/points
    realtime_topic: /drone/transport/realtime_tx
    realtime_ack_topic: /drone/transport/realtime_ack
    realtime_ack_metrics_topic: /drone/comm/realtime_ack_metrics
    sync_topic: /drone/transport/sync_tx
    sync_ack_topic: /drone/transport/sync_ack
    sync_request_topic: /drone/transport/sync_request
    link_metrics_topic: /surf/comm/link_metrics
    metrics_topic: /drone/comm/pipeline_metrics
    pose_source:
      type: tf
      odometry_topic: /drone/odom
      odometry_parent_frame: map
      base_frame: drone/body
      max_age_ms: 50.0
      tf_timeout_ms: 500.0
    resolution: 0.05
    compression_level: 1
    transport:
      maximum_packet_bytes: 1200
    dynamic_retention_scans: 20
    maximum_ray_voxels: 1200
    maximum_clear_rays: 4096
    filters:
      min_range: 0.75
      max_range: 50.0
      min_z: 0.25
      max_z: 20.0
      self_radius: 0.7
      humanoid_mask:
        enabled: true
        odometry_topic: /drone/transport/humanoid_odometry
        model_size_x: 0.6
        model_size_y: 0.7
        model_size_z: 1.4
        model_center_z: 0.7
        padding: 0.2
        max_age_ms: 150.0
      static_min_hits: 20
      clear_min_misses: 3
    allocation:
      dt: 0.1
      a:
      - 1.0
      - 0.0
      - 0.0
      - 1.0
      b:
      - -0.001
      - 0.0
      - 0.0
      - -0.001
      q:
      - 1.0
      - 0.0
      - 0.0
      - 1.0
      r:
      - 0.0001
      - 0.0
      - 0.0
      - 0.0001
    delivery:
      ack_timeout_seconds: 2.0
      defer_seconds: 0.2
    capacity:
      development_bytes_per_second: 10000.0
      telemetry_timeout_seconds: 3.0
    scheduling:
      delta_hz: 10.0
      backlog_hz: 10.0
      starvation_fraction: 0.1
      starvation_age_seconds: 30.0
    priority:
      delta:
        base: 1.0
        age: 1.0
        proximity: 1.0
        dynamic: 1.0
        destructive: 1.0
        age_seconds: 10.0
        distance_metres: 10.0
      backlog:
        base: 1.0
        age: 2.0
        proximity: 1.0
        dynamic: 1.0
        destructive: 1.0
        age_seconds: 10.0
        distance_metres: 10.0
